<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">神通川截彎取直與富岩運河誕生</title><desc id="desc">先在蛇行河道西側開挖捷徑，引導洪水拓寬為新主流；再以運河土方填整舊河床，形成新市街。概念圖，不按比例。</desc><rect width="1100" height="500" fill="#f2eee3"/><g font-family="sans-serif" fill="#20383b"><text x="38" y="48" font-size="25" font-weight="bold">一條新河道，如何帶來一座新市區？</text><text x="38" y="80" font-size="17">神通川改道 → 廢川地形成 → 運河土方填整市街</text><rect x="25" y="108" width="330" height="348" rx="12" fill="#fffcf6"/><text x="45" y="145" font-size="20" font-weight="bold">01  先有蛇行河道</text><rect x="385" y="108" width="330" height="348" rx="12" fill="#fffcf6"/><text x="405" y="145" font-size="20" font-weight="bold">02  開出西側捷徑</text><rect x="745" y="108" width="330" height="348" rx="12" fill="#fffcf6"/><text x="765" y="145" font-size="20" font-weight="bold">03  填地與開鑿運河</text><path d="M160,400 C160,340 315,345 295,280 S155,250 160,188" fill="none" stroke="#2d8195" stroke-width="21"/><path d="M520,400 C520,340 675,345 655,280 S515,250 520,188" fill="none" stroke="#bbd2d4" stroke-width="21"/><path d="M880,400 C880,340 1035,345 1015,280 S875,250 880,188" fill="none" stroke="#d1c9ab" stroke-width="21"/><text x="52" y="235" font-size="17">舊神通川</text><text x="52" y="264" font-size="16">彎道附近易溢流</text><text x="218" y="384" font-size="16">富山城一帶</text><path d="M520,400 L520,188" stroke="#2d8195" stroke-width="13" stroke-dasharray="9 7"/><text x="407" y="237" font-size="16">馳越線</text><text x="407" y="265" font-size="15">先挖細水道</text><text x="407" y="289" font-size="15">洪水逐漸拓寬</text><text x="565" y="374" font-size="15">留下舊河床</text><path d="M880,400 L880,188" stroke="#2d8195" stroke-width="23"/><path d="M978,303 L978,184" stroke="#a9762a" stroke-width="10"/><path d="M910,315 Q940,294 958,271" fill="none" stroke="#a9762a" stroke-width="4"/><text x="766" y="241" font-size="16">新主流</text><text x="966" y="338" font-size="16">富岩運河</text><text x="919" y="389" font-size="16">填整成新市街</text><text x="38" y="486" font-size="15" fill="#5d6b6c">概念示意：非測繪地圖，方向與距離未按比例；運河與神通川為不同水路。</text></g></svg>